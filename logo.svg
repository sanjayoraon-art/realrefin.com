<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="logoEmeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Mark (96x96) -->
  <g transform="translate(12, 12)">
    <rect width="96" height="96" rx="22" fill="url(#logoBgGrad)"/>
    <!-- House & Growth Line -->
    <path d="M 20 50 L 48 24 L 76 50" fill="none" stroke="url(#logoEmeraldGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Pillar -->
    <rect x="25" y="48" width="14" height="28" rx="3" fill="#ffffff"/>
    <rect x="44" y="54" width="8" height="22" rx="2" fill="#ffffff" fill-opacity="0.9"/>
    <!-- Arrow -->
    <path d="M 44 68 L 62 50 L 68 56 L 74 38 L 56 44 L 62 50 Z" fill="url(#logoEmeraldGrad)"/>
  </g>

  <!-- Wordmark Text -->
  <text x="128" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="46" font-weight="800" letter-spacing="-1.5">
    <tspan fill="#0f172a">Real</tspan>
    <tspan fill="#10b981">Refin</tspan>
    <tspan fill="#64748b" font-weight="600" font-size="34">.com</tspan>
  </text>
  
  <!-- Sub-tagline -->
  <text x="130" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#94a3b8" text-transform="uppercase">
    Institutional Real Estate Analytics
  </text>
</svg>
